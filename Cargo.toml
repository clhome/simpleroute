[package]
name = "simpleroute"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.29.1", default-features = true, features = ["glow"] }
tray-icon = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.5"
notify-rust = "4"
chrono = "0.4"
parking_lot = "0.12"
windows-sys = { version = "0.52", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_WindowsAndMessaging"
] }

[build-dependencies]
embed-resource = "2.4"
